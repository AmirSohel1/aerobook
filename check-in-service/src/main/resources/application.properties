# ==============================================================================
# Aerobook Cloud Airline Platform - Airport Check-In & Boarding Pass Service (Port 8090)
# ==============================================================================

# Application Identifier used for Eureka registration and configuration binding
spring.application.name=check-in-service

# Optional Spring Cloud Config Server Import
spring.config.import=optional:configserver:http://localhost:8080

# ------------------------------------------------------------------------------
# Embedded Tomcat Ingress Port
# ------------------------------------------------------------------------------
server.port=8090

# ------------------------------------------------------------------------------
# MySQL 8 Database Configuration
# ------------------------------------------------------------------------------
# Database JDBC URL: Connects to 'aerobook_checkin_db' schema; creates it if missing
spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3306/aerobook_checkin_db?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${MYSQL_USERNAME:root}
spring.datasource.password=${MYSQL_PASSWORD:Amir1121@}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ------------------------------------------------------------------------------
# JPA / Hibernate Configuration
# ------------------------------------------------------------------------------
# DDL schema mode: validates and updates existing check-in tables
spring.jpa.hibernate.ddl-auto=update
# Disable Open EntityManager in View to prevent web thread database connection holding
spring.jpa.open-in-view=false

# ------------------------------------------------------------------------------
# Netflix Eureka Service Discovery Client
# ------------------------------------------------------------------------------
# Register Check-In Service with Eureka discovery registry
eureka.client.register-with-eureka=true
# Enable fetching service metadata for inter-service communication
eureka.client.fetch-registry=true
# Eureka discovery server registration endpoint
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
# Prefer container / host IP address over hostname in discovery registry
eureka.instance.prefer-ip-address=true

# ==========================================
# SWAGGER / OPENAPI CONFIGURATION
# ==========================================
# ------------------------------------------------------------------------------
# Jackson JSON Serialization
# ------------------------------------------------------------------------------
# Exclude null values from JSON responses to prevent OpenAPI $ref resolver issues
spring.jackson.default-property-inclusion=non_null

# ------------------------------------------------------------------------------
# SpringDoc OpenAPI 3 / Swagger UI Configuration
# ------------------------------------------------------------------------------
# Enable OpenAPI JSON endpoint generation at /v3/api-docs
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/v3/api-docs

# Enable interactive Swagger UI HTML interface at /swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html

# Collapse operations list by default for clean presentation
springdoc.swagger-ui.doc-expansion=list
# Sort operations by HTTP method (GET, POST, PUT, DELETE)
springdoc.swagger-ui.operations-sorter=method
# Sort API group tags alphabetically
springdoc.swagger-ui.tags-sorter=alpha
# Enable dynamic endpoint filtering
springdoc.swagger-ui.filter=true
# Retain JWT authorization token on page refreshes
springdoc.swagger-ui.persist-authorization=true
# Display response execution duration in milliseconds
springdoc.swagger-ui.display-request-duration=true
# Pre-expand 'Try it out' controls for instant testing
springdoc.swagger-ui.try-it-out-enabled=true

