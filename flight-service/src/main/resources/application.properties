# ===================================================================
# Flight Service Application Configuration
# AeroBook Multi-Module Microservices Platform
# Service Port: 8087
# ===================================================================

# -------------------------------------------------------------------
# Service Identification & Networking
# -------------------------------------------------------------------
spring.application.name=flight-service
server.port=8087

# -------------------------------------------------------------------
# MySQL Relational Database Configuration
# -------------------------------------------------------------------
spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3306/aerobook_flight_db?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${MYSQL_USERNAME:root}
spring.datasource.password=${MYSQL_PASSWORD:Amir1121@}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# -------------------------------------------------------------------
# Netflix Eureka Service Discovery Client
# -------------------------------------------------------------------
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

# -------------------------------------------------------------------
# RabbitMQ Asynchronous Messaging Configuration
# -------------------------------------------------------------------
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
app.rabbitmq.enabled=${RABBITMQ_ENABLED:false}
spring.rabbitmq.listener.simple.auto-startup=${RABBITMQ_ENABLED:false}
# -------------------------------------------------------------------
# Logging Configuration (SLF4J / Logback)
# -------------------------------------------------------------------
logging.level.root=INFO
logging.level.com.aerobook=DEBUG
logging.level.org.springframework.web=INFO
logging.pattern.console=%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(%5p) %clr(${PID:- }){magenta} --- [%15.15t] %clr(%-40.40logger{39}){cyan} : %m%n

# ===================================================================
# Jackson JSON Serialization Settings
# Enforces non-null inclusion to eliminate Swagger UI $ref resolver issues
# ===================================================================
spring.jackson.default-property-inclusion=non_null

# ===================================================================
# OpenAPI / Swagger UI Specification Settings
# ===================================================================
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.doc-expansion=list
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.filter=true
springdoc.swagger-ui.persist-authorization=true
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.try-it-out-enabled=true