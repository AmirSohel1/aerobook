# ==============================================================================
# Aerobook Cloud Airline Platform - Payment Service (Port 8092)
# ==============================================================================

# Application Identifier used for Eureka registration and configuration lookup
spring.application.name=payment-service

# Optional Spring Cloud Config Server Import
spring.config.import=optional:configserver:http://localhost:8080

# ------------------------------------------------------------------------------
# Embedded Server Configuration
# ------------------------------------------------------------------------------
# Dedicated HTTP server port for Razorpay Payment Microservice
server.port=8092

# ------------------------------------------------------------------------------
# MySQL 8 Database Configuration
# ------------------------------------------------------------------------------
# Database JDBC URL: Connects to 'aerobook_payment_db' schema; creates it if missing
spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3306/aerobook_payment_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${MYSQL_USERNAME:root}
spring.datasource.password=${MYSQL_PASSWORD:Amir1121@}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ------------------------------------------------------------------------------
# JPA / Hibernate Configuration
# ------------------------------------------------------------------------------
# DDL schema mode: validates and updates existing payment record tables
spring.jpa.hibernate.ddl-auto=update
# Disable Open EntityManager in View pattern to prevent web threads holding connections
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ------------------------------------------------------------------------------
# Netflix Eureka Service Discovery Client
# ------------------------------------------------------------------------------
# Register Payment Service with Eureka service discovery
eureka.client.register-with-eureka=true
# Fetch registry metadata for inter-service communication
eureka.client.fetch-registry=true
# Eureka discovery server registration endpoint
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
# Prefer container / host IP address over hostname in discovery registry
eureka.instance.prefer-ip-address=true

# ------------------------------------------------------------------------------
# Logging Configuration (SLF4J / Logback)
# ------------------------------------------------------------------------------
logging.level.root=INFO
logging.level.com.aerobook=DEBUG
logging.level.org.springframework.web=INFO

# ------------------------------------------------------------------------------
# Jackson JSON Serialization
# ------------------------------------------------------------------------------
# Exclude null values from JSON responses to prevent OpenAPI $ref resolver issues
spring.jackson.default-property-inclusion=non_null

# ------------------------------------------------------------------------------
# SpringDoc OpenAPI 3 / Swagger UI Configuration
# ------------------------------------------------------------------------------
# Enable OpenAPI JSON endpoint generation at /v3/api-docs
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/v3/api-docs
# Enable interactive Swagger UI HTML interface at /swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.doc-expansion=list
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.filter=true
springdoc.swagger-ui.try-it-out-enabled=true

# ------------------------------------------------------------------------------
# Razorpay Payment Gateway Configuration (Test Mode / Production)
# ------------------------------------------------------------------------------
# Key ID is public and can be passed to frontend checkout options
razorpay.key.id=${RAZORPAY_KEY_ID:rzp_test_TiGBpThLMx6w6T}
# Key Secret MUST remain private on the backend payment-service
razorpay.key.secret=${RAZORPAY_KEY_SECRET:8xbFOJXwccYYxURtAlcF6d8c}
# Webhook Secret configured in Razorpay Dashboard for webhook signature verification
razorpay.webhook.secret=${RAZORPAY_WEBHOOK_SECRET:whsec_test_secret_aerobook_2026}
# Standard transaction currency
razorpay.currency=INR

