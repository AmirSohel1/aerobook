# ==============================================================================
# Aerobook Cloud Airline Platform - API Gateway Configuration (Port 8083)
# ==============================================================================

# Application Identity & Spring Cloud Config
spring.application.name=api-gateway
spring.config.import=optional:configserver:http://localhost:8080

# Gateway Ingress Port
server.port=8083

# ------------------------------------------------------------------------------
# Netflix Eureka Service Discovery Client
# ------------------------------------------------------------------------------
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# ------------------------------------------------------------------------------
# Spring Cloud Gateway Discovery Locator
# ------------------------------------------------------------------------------
# Enables dynamic reactive routing to Eureka registered services (lb://<SERVICE_ID>)
spring.cloud.gateway.server.webflux.discovery.locator.enabled=true
spring.cloud.gateway.server.webflux.discovery.locator.lower-case-service-id=true

# ------------------------------------------------------------------------------
# JWT Security Token Configuration
# ------------------------------------------------------------------------------
# HMAC-SHA 256-bit signing key for JWT validation and downstream header propagation
jwt.secret=MySuperSecretKeyForJwtGenerationMustBeAtLeast32Characters

# ------------------------------------------------------------------------------
# Logging Configuration (SLF4J / Logback)
# ------------------------------------------------------------------------------
logging.level.root=INFO
logging.level.com.aerobook=DEBUG
logging.level.org.springframework.cloud.gateway=INFO
logging.pattern.console=%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(%5p) %clr(${PID:- }){magenta} --- [%15.15t] %clr(%-40.40logger{39}){cyan} : %m%n

# ------------------------------------------------------------------------------
# Jackson Serialization
# ------------------------------------------------------------------------------
spring.jackson.default-property-inclusion=non_null

# ------------------------------------------------------------------------------
# OpenAPI 3 / Swagger UI Centralized Aggregator & Multi-Service Dropdown
# ------------------------------------------------------------------------------
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html

# Multi-Service Dropdown Definitions (eliminates long vertical scrolling)
# Each entry populates the "Select a definition" selector in Swagger UI
springdoc.swagger-ui.urls[0].name=\uD83C\uDF1F All Microservices (Complete Platform View)
springdoc.swagger-ui.urls[0].url=/v3/api-docs
springdoc.swagger-ui.urls[1].name=\uD83D\uDD11 1. Authentication Service (Port 8082)
springdoc.swagger-ui.urls[1].url=/api/gateway/docs/auth-service
springdoc.swagger-ui.urls[2].name=\uD83D\uDC64 2. User Profile Service (Port 8084)
springdoc.swagger-ui.urls[2].url=/api/gateway/docs/user-service
springdoc.swagger-ui.urls[3].name=\u2708\uFE0F 3. Flight Scheduling Service (Port 8087)
springdoc.swagger-ui.urls[3].url=/api/gateway/docs/flight-service
springdoc.swagger-ui.urls[4].name=\uD83D\uDCB3 4. Fare & Pricing Service (Port 8089)
springdoc.swagger-ui.urls[4].url=/api/gateway/docs/fare-service
springdoc.swagger-ui.urls[5].name=\uD83C\uDF9F\uFE0F 5. Booking & Messaging Service (Port 8088)
springdoc.swagger-ui.urls[5].url=/api/gateway/docs/booking-service
springdoc.swagger-ui.urls[6].name=\uD83D\uDEC2 6. Airport Check-In Service (Port 8090)
springdoc.swagger-ui.urls[6].url=/api/gateway/docs/check-in-service
springdoc.swagger-ui.urls[7].name=\uD83C\uDF10 0. API Gateway Platform Hub (Port 8083)
springdoc.swagger-ui.urls[7].url=/api/gateway/docs/gateway
springdoc.swagger-ui.urls-primary-name=\uD83C\uDF1F All Microservices (Complete Platform View)

# Swagger UI Display Preferences
springdoc.swagger-ui.doc-expansion=list
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.filter=true
springdoc.swagger-ui.persist-authorization=true
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.try-it-out-enabled=true

# ------------------------------------------------------------------------------
# Gateway Global CORS Configuration
# ------------------------------------------------------------------------------
# Enables web browser clients, Swagger UI, and single-page apps to call APIs across origins
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-origins=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-headers=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allow-credentials=false