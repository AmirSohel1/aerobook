<div
  [class.dark]="themeService.isDark()"
  class="min-h-screen flex flex-col font-sans bg-[var(--bg)] text-ink selection:bg-accent selection:text-white antialiased transition-colors duration-200"
>
  <!-- Global Top Navigation Header (Fixed Floating Pill) -->
  <app-navbar
    (openLogin)="openLogin()"
    (openRegister)="openRegister()"
  ></app-navbar>

  <!-- Dynamic Page Content Routed by Angular Router (padded for fixed navbar) -->
  <main class="flex-grow pt-20 sm:pt-24">
    <router-outlet></router-outlet>
  </main>

  <!-- Short Bottom Footer -->
  <footer
    class="mt-auto border-t border-line bg-surface/60 backdrop-blur-md py-3 px-4 sm:px-6 lg:px-8 text-xs text-ink-3 transition-colors"
  >
    <div
      class="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-2"
    >
      <div class="flex items-center gap-2">
        <span class="font-bold text-ink flex items-center gap-1.5">
          <span class="w-1.5 h-1.5 rounded-full bg-accent animate-pulse"></span>
          AeroBook
        </span>
        <span>•</span>
        <span>© 2026 AeroBook Airlines. All systems operational.</span>
      </div>
      <div class="flex items-center gap-3 text-[11px]">
        <span class="text-emerald-600 dark:text-emerald-400 flex items-center gap-1">
          <span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span> 8 Microservices Healthy
        </span>
        <span>•</span>
        <span>Spring Cloud & Angular 18</span>
      </div>
    </div>
  </footer>

  <!-- Login Modal Dialog -->
  @if (authService.loginModalOpen()) {
    <app-login-modal
      (close)="closeModals()"
      (openRegister)="openRegister()"
    ></app-login-modal>
  }

  <!-- Registration Modal Dialog -->
  @if (authService.registerModalOpen()) {
    <app-register-modal
      (close)="closeModals()"
      (openLogin)="openLogin()"
    ></app-register-modal>
  }
</div>
