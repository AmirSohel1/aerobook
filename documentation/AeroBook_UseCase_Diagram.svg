<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1120" width="1600" height="1120" style="background-color: #000000; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;">
  <defs>
    <!-- Marker: White Arrowhead for <<include>> / <<extend>> -->
    <marker id="white-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ffffff" stroke="#ffffff" />
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="1600" height="1120" fill="#000000" />

  <!-- HEADER -->
  <text x="800" y="42" fill="#ffffff" font-size="22" font-weight="bold" letter-spacing="2" text-anchor="middle">
    AEROBOOK PLATFORM - SYSTEM USE CASE DIAGRAM
  </text>
  <text x="800" y="65" fill="#aaaaaa" font-size="12" font-family="monospace" letter-spacing="1" text-anchor="middle">
    Enterprise Microservices Architecture • UML 2.5 Specification • Dark Canvas &amp; White Marker Theme
  </text>

  <!-- SYSTEM BOUNDARY RECTANGLE -->
  <g id="system-boundary">
    <rect x="290" y="85" width="1000" height="1005" rx="16" fill="#000000" stroke="#ffffff" stroke-width="2.5" stroke-dasharray="8 6" />
    <rect x="310" y="70" width="460" height="30" rx="4" fill="#000000" stroke="#ffffff" stroke-width="1.5" />
    <text x="540" y="90" fill="#ffffff" font-family="monospace, sans-serif" font-size="13" font-weight="bold" letter-spacing="1.5" text-anchor="middle">
      SYSTEM BOUNDARY: AeroBook Airline Platform
    </text>
  </g>

  <!-- SUB-SYSTEM BOUNDARY GROUPINGS -->
  <!-- Group 1: Auth & User -->
  <g id="group-auth-user">
    <rect x="310" y="115" width="960" height="175" rx="10" fill="#050505" stroke="#ffffff" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="4 4" />
    <text x="325" y="133" fill="#aaaaaa" font-family="monospace" font-size="11" font-weight="bold">MODULE: Identity, Auth &amp; User Profile (Ports 8082, 8084)</text>
  </g>

  <!-- Group 2: Flight & Fares -->
  <g id="group-flight-fares">
    <rect x="310" y="300" width="960" height="185" rx="10" fill="#050505" stroke="#ffffff" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="4 4" />
    <text x="325" y="318" fill="#aaaaaa" font-family="monospace" font-size="11" font-weight="bold">MODULE: Flight Schedules &amp; Dynamic Pricing (Ports 8087, 8089)</text>
  </g>

  <!-- Group 3: Reservations & Messaging -->
  <g id="group-reservations">
    <rect x="310" y="495" width="960" height="300" rx="10" fill="#050505" stroke="#ffffff" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="4 4" />
    <text x="325" y="513" fill="#aaaaaa" font-family="monospace" font-size="11" font-weight="bold">MODULE: Booking Engine &amp; Event Messaging (Port 8088, RabbitMQ 5672)</text>
  </g>

  <!-- Group 4: Airport Check-In & Gate -->
  <g id="group-checkin">
    <rect x="310" y="805" width="960" height="270" rx="10" fill="#050505" stroke="#ffffff" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="4 4" />
    <text x="325" y="823" fill="#aaaaaa" font-family="monospace" font-size="11" font-weight="bold">MODULE: Airport Check-In &amp; Boarding Pass Gate (Port 8090)</text>
  </g>

  <!-- ASSOCIATION LINES: PASSENGER -->
  <g id="lines-passenger">
    <line x1="140" y1="520" x2="460" y2="160" stroke="#ffffff" stroke-width="1.8" />
    <line x1="140" y1="520" x2="460" y2="215" stroke="#ffffff" stroke-width="1.8" />
    <line x1="140" y1="520" x2="460" y2="265" stroke="#ffffff" stroke-width="1.8" />
    <line x1="140" y1="520" x2="460" y2="345" stroke="#ffffff" stroke-width="1.8" />
    <line x1="140" y1="520" x2="460" y2="435" stroke="#ffffff" stroke-width="1.8" />
    <line x1="140" y1="520" x2="460" y2="570" stroke="#ffffff" stroke-width="2.2" />
    <line x1="140" y1="520" x2="460" y2="720" stroke="#ffffff" stroke-width="1.8" />
    <line x1="140" y1="520" x2="460" y2="865" stroke="#ffffff" stroke-width="1.8" />
    <line x1="140" y1="520" x2="460" y2="995" stroke="#ffffff" stroke-width="1.8" />
  </g>

  <!-- ASSOCIATION LINES: ADMIN -->
  <g id="lines-admin">
    <line x1="1440" y1="230" x2="1140" y2="160" stroke="#ffffff" stroke-width="1.8" />
    <line x1="1440" y1="230" x2="1140" y2="225" stroke="#ffffff" stroke-width="1.8" />
    <line x1="1440" y1="230" x2="1140" y2="345" stroke="#ffffff" stroke-width="1.8" />
    <line x1="1440" y1="230" x2="1140" y2="430" stroke="#ffffff" stroke-width="1.8" />
  </g>

  <!-- ASSOCIATION LINES: STAFF -->
  <g id="lines-staff">
    <line x1="1440" y1="940" x2="790" y2="980" stroke="#ffffff" stroke-width="2" />
    <line x1="1440" y1="940" x2="460" y2="865" stroke="#ffffff" stroke-width="1.6" stroke-dasharray="4 3" />
  </g>

  <!-- ASSOCIATION LINES: EXTERNAL SYSTEMS -->
  <g id="lines-system">
    <line x1="900" y1="630" x2="1360" y2="630" stroke="#ffffff" stroke-width="2" />
    <line x1="920" y1="740" x2="1360" y2="740" stroke="#ffffff" stroke-width="2" />
  </g>

  <!-- INCLUDE / EXTEND DEPENDENCIES -->
  <g id="include-extend-lines">
    <!-- UC02 -> UC02a (Verify JWT) -->
    <path d="M 570 215 L 670 215" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#white-arrow)" />
    <text x="620" y="208" fill="#ffffff" font-size="10" font-family="monospace" text-anchor="middle">&lt;&lt;include&gt;&gt;</text>

    <!-- UC04 -> UC04a (Check Seat Availability) -->
    <path d="M 575 345 L 665 345" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#white-arrow)" />
    <text x="620" y="338" fill="#ffffff" font-size="10" font-family="monospace" text-anchor="middle">&lt;&lt;include&gt;&gt;</text>

    <!-- UC05 -> UC05a (Surge Multiplier) -->
    <path d="M 570 435 L 655 435" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#white-arrow)" />
    <text x="612" y="428" fill="#ffffff" font-size="10" font-family="monospace" text-anchor="middle">&lt;&lt;include&gt;&gt;</text>

    <!-- UC06 -> UC06a (Lock Seat) -->
    <path d="M 560 560 L 685 550" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#white-arrow)" />
    <text x="620" y="548" fill="#ffffff" font-size="10" font-family="monospace" text-anchor="middle">&lt;&lt;include&gt;&gt;</text>

    <!-- UC06 -> UC06b (Process Payment) -->
    <path d="M 575 580 L 675 620" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#white-arrow)" />
    <text x="625" y="608" fill="#ffffff" font-size="10" font-family="monospace" text-anchor="middle">&lt;&lt;include&gt;&gt;</text>

    <!-- UC06 -> UC06c (Generate PNR) -->
    <path d="M 550 595 L 670 675" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#white-arrow)" />
    <text x="610" y="650" fill="#ffffff" font-size="10" font-family="monospace" text-anchor="middle">&lt;&lt;include&gt;&gt;</text>

    <!-- UC06 -> UC06d (Publish Event) -->
    <path d="M 520 605 L 670 735" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#white-arrow)" />
    <text x="595" y="685" fill="#ffffff" font-size="10" font-family="monospace" text-anchor="middle">&lt;&lt;include&gt;&gt;</text>

    <!-- UC07 -> UC07a (Release Seat) -->
    <path d="M 570 720 L 665 720" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#white-arrow)" />
    <text x="620" y="713" fill="#ffffff" font-size="10" font-family="monospace" text-anchor="middle">&lt;&lt;include&gt;&gt;</text>

    <!-- UC08 -> UC09 (Select Seat) -->
    <path d="M 570 865 L 670 865" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#white-arrow)" />
    <text x="620" y="858" fill="#ffffff" font-size="10" font-family="monospace" text-anchor="middle">&lt;&lt;include&gt;&gt;</text>

    <!-- UC08 -> UC10 (Boarding Pass) -->
    <path d="M 460 895 L 460 965" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#white-arrow)" />
    <text x="495" y="935" fill="#ffffff" font-size="10" font-family="monospace" text-anchor="middle">&lt;&lt;include&gt;&gt;</text>
  </g>

  <!-- USE CASE NODES (WHITE OVALS / BLACK FILL) -->
  <g id="use-case-nodes">
    <!-- UC-01: Register Account -->
    <ellipse cx="460" cy="160" rx="105" ry="26" fill="#000000" stroke="#ffffff" stroke-width="2" />
    <text x="460" y="164" fill="#ffffff" font-size="12" font-weight="600" text-anchor="middle">UC-01: Register Account</text>

    <!-- UC-02: Login & Authenticate -->
    <ellipse cx="460" cy="215" rx="110" ry="26" fill="#000000" stroke="#ffffff" stroke-width="2" />
    <text x="460" y="219" fill="#ffffff" font-size="12" font-weight="600" text-anchor="middle">UC-02: Login &amp; Authenticate</text>

    <!-- UC-02a: Verify JWT Credentials -->
    <ellipse cx="780" cy="215" rx="110" ry="25" fill="#000000" stroke="#ffffff" stroke-width="1.8" stroke-dasharray="5 4" />
    <text x="780" y="219" fill="#ffffff" font-size="11" text-anchor="middle">UC-02a: Verify JWT Token</text>

    <!-- UC-03: Manage Profile & Preferences -->
    <ellipse cx="460" cy="265" rx="115" ry="24" fill="#000000" stroke="#ffffff" stroke-width="2" />
    <text x="460" y="269" fill="#ffffff" font-size="12" font-weight="600" text-anchor="middle">UC-03: Manage Profile &amp; Info</text>

    <!-- UC-04: Search Flights -->
    <ellipse cx="460" cy="345" rx="115" ry="26" fill="#000000" stroke="#ffffff" stroke-width="2" />
    <text x="460" y="349" fill="#ffffff" font-size="12" font-weight="600" text-anchor="middle">UC-04: Search Flights &amp; Routes</text>

    <!-- UC-04a: Check Seat Availability -->
    <ellipse cx="780" cy="345" rx="115" ry="25" fill="#000000" stroke="#ffffff" stroke-width="1.8" stroke-dasharray="5 4" />
    <text x="780" y="349" fill="#ffffff" font-size="11" text-anchor="middle">UC-04a: Check Seat Inventory</text>

    <!-- UC-05: View Dynamic Fares -->
    <ellipse cx="460" cy="435" rx="110" ry="26" fill="#000000" stroke="#ffffff" stroke-width="2" />
    <text x="460" y="439" fill="#ffffff" font-size="12" font-weight="600" text-anchor="middle">UC-05: View Dynamic Fares</text>

    <!-- UC-05a: Calculate Dynamic Multiplier -->
    <ellipse cx="790" cy="435" rx="130" ry="25" fill="#000000" stroke="#ffffff" stroke-width="1.8" stroke-dasharray="5 4" />
    <text x="790" y="439" fill="#ffffff" font-size="11" text-anchor="middle">UC-05a: Calculate Surge Multipliers</text>

    <!-- UC-06: Book Flight Ticket -->
    <ellipse cx="460" cy="570" rx="115" ry="30" fill="#000000" stroke="#ffffff" stroke-width="2.5" />
    <text x="460" y="574" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">UC-06: Book Flight Ticket</text>

    <!-- UC-06a: Lock Seat -->
    <ellipse cx="790" cy="545" rx="105" ry="24" fill="#000000" stroke="#ffffff" stroke-width="1.8" stroke-dasharray="5 4" />
    <text x="790" y="549" fill="#ffffff" font-size="11" text-anchor="middle">UC-06a: Lock Seat</text>

    <!-- UC-06b: Process Payment Transaction -->
    <ellipse cx="790" cy="630" rx="110" ry="25" fill="#000000" stroke="#ffffff" stroke-width="1.8" stroke-dasharray="5 4" />
    <text x="790" y="634" fill="#ffffff" font-size="11" text-anchor="middle">UC-06b: Process Payment</text>

    <!-- UC-06c: Generate Unique 6-Char PNR -->
    <ellipse cx="790" cy="685" rx="120" ry="25" fill="#000000" stroke="#ffffff" stroke-width="1.8" stroke-dasharray="5 4" />
    <text x="790" y="689" fill="#ffffff" font-size="11" text-anchor="middle">UC-06c: Generate 6-Char PNR</text>

    <!-- UC-06d: Publish RabbitMQ Event -->
    <ellipse cx="790" cy="740" rx="125" ry="25" fill="#000000" stroke="#ffffff" stroke-width="1.8" stroke-dasharray="5 4" />
    <text x="790" y="744" fill="#ffffff" font-size="11" text-anchor="middle">UC-06d: Publish RabbitMQ Event</text>

    <!-- UC-07: Cancel Booking -->
    <ellipse cx="460" cy="720" rx="110" ry="26" fill="#000000" stroke="#ffffff" stroke-width="2" />
    <text x="460" y="724" fill="#ffffff" font-size="12" font-weight="600" text-anchor="middle">UC-07: Cancel Booking</text>

    <!-- UC-07a: Release Seat to Inventory -->
    <ellipse cx="790" cy="780" rx="125" ry="24" fill="#000000" stroke="#ffffff" stroke-width="1.8" stroke-dasharray="5 4" />
    <text x="790" y="784" fill="#ffffff" font-size="11" text-anchor="middle">UC-07a: Release Seat to Inventory</text>

    <!-- UC-08: Online Web Check-In -->
    <ellipse cx="460" cy="865" rx="110" ry="28" fill="#000000" stroke="#ffffff" stroke-width="2" />
    <text x="460" y="869" fill="#ffffff" font-size="12" font-weight="600" text-anchor="middle">UC-08: Online Web Check-In</text>

    <!-- UC-09: Select / Change Seat -->
    <ellipse cx="790" cy="865" rx="115" ry="26" fill="#000000" stroke="#ffffff" stroke-width="1.8" stroke-dasharray="5 4" />
    <text x="790" y="869" fill="#ffffff" font-size="11" text-anchor="middle">UC-09: Select / Change Seat</text>

    <!-- UC-10: Generate Digital Boarding Pass -->
    <ellipse cx="460" cy="995" rx="120" ry="28" fill="#000000" stroke="#ffffff" stroke-width="2" />
    <text x="460" y="999" fill="#ffffff" font-size="12" font-weight="600" text-anchor="middle">UC-10: Generate Boarding Pass</text>

    <!-- UC-11: Validate Boarding at Gate -->
    <ellipse cx="790" cy="980" rx="125" ry="28" fill="#000000" stroke="#ffffff" stroke-width="2" />
    <text x="790" y="984" fill="#ffffff" font-size="12" font-weight="600" text-anchor="middle">UC-11: Validate Boarding at Gate</text>

    <!-- UC-12: Manage Aircraft Fleet (Admin) -->
    <ellipse cx="1140" cy="160" rx="115" ry="26" fill="#000000" stroke="#ffffff" stroke-width="2" />
    <text x="1140" y="164" fill="#ffffff" font-size="12" font-weight="600" text-anchor="middle">UC-12: Manage Aircraft Fleet</text>

    <!-- UC-13: Manage Flight Schedules (Admin) -->
    <ellipse cx="1140" cy="225" rx="120" ry="26" fill="#000000" stroke="#ffffff" stroke-width="2" />
    <text x="1140" y="229" fill="#ffffff" font-size="12" font-weight="600" text-anchor="middle">UC-13: Manage Flight Schedules</text>

    <!-- UC-14: Configure Fare Rules (Admin) -->
    <ellipse cx="1140" cy="345" rx="115" ry="26" fill="#000000" stroke="#ffffff" stroke-width="2" />
    <text x="1140" y="349" fill="#ffffff" font-size="12" font-weight="600" text-anchor="middle">UC-14: Configure Fare Rules</text>

    <!-- UC-15: Monitor Gateway Metrics (Admin) -->
    <ellipse cx="1140" cy="430" rx="125" ry="26" fill="#000000" stroke="#ffffff" stroke-width="2" />
    <text x="1140" y="434" fill="#ffffff" font-size="12" font-weight="600" text-anchor="middle">UC-15: Monitor Gateway Health</text>
  </g>

  <!-- ACTOR 1: PASSENGER (LEFT) -->
  <g id="actor-passenger">
    <circle cx="140" cy="480" r="22" fill="#000000" stroke="#ffffff" stroke-width="2.5" />
    <line x1="140" y1="502" x2="140" y2="555" stroke="#ffffff" stroke-width="2.5" />
    <line x1="105" y1="520" x2="175" y2="520" stroke="#ffffff" stroke-width="2.5" />
    <line x1="140" y1="555" x2="115" y2="605" stroke="#ffffff" stroke-width="2.5" />
    <line x1="140" y1="555" x2="165" y2="605" stroke="#ffffff" stroke-width="2.5" />
    <text x="140" y="635" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle">Passenger</text>
    <text x="140" y="652" fill="#aaaaaa" font-size="11" font-family="monospace" text-anchor="middle">[ROLE_PASSENGER]</text>
  </g>

  <!-- ACTOR 2: AIRLINE ADMINISTRATOR (TOP RIGHT) -->
  <g id="actor-admin">
    <circle cx="1440" cy="190" r="22" fill="#000000" stroke="#ffffff" stroke-width="2.5" />
    <line x1="1440" y1="212" x2="1440" y2="265" stroke="#ffffff" stroke-width="2.5" />
    <line x1="1405" y1="230" x2="1475" y2="230" stroke="#ffffff" stroke-width="2.5" />
    <line x1="1440" y1="265" x2="1415" y2="315" stroke="#ffffff" stroke-width="2.5" />
    <line x1="1440" y1="265" x2="1465" y2="315" stroke="#ffffff" stroke-width="2.5" />
    <text x="1440" y="345" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle">Airline Administrator</text>
    <text x="1440" y="362" fill="#aaaaaa" font-size="11" font-family="monospace" text-anchor="middle">[ROLE_ADMIN]</text>
  </g>

  <!-- ACTOR 3: AIRPORT GATE STAFF (BOTTOM RIGHT) -->
  <g id="actor-staff">
    <circle cx="1440" cy="900" r="22" fill="#000000" stroke="#ffffff" stroke-width="2.5" />
    <line x1="1440" y1="922" x2="1440" y2="975" stroke="#ffffff" stroke-width="2.5" />
    <line x1="1405" y1="940" x2="1475" y2="940" stroke="#ffffff" stroke-width="2.5" />
    <line x1="1440" y1="975" x2="1415" y2="1025" stroke="#ffffff" stroke-width="2.5" />
    <line x1="1440" y1="975" x2="1465" y2="1025" stroke="#ffffff" stroke-width="2.5" />
    <text x="1440" y="1055" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle">Gate Agent / Staff</text>
    <text x="1440" y="1072" fill="#aaaaaa" font-size="11" font-family="monospace" text-anchor="middle">[ROLE_STAFF]</text>
  </g>

  <!-- SECONDARY SYSTEMS (RIGHT) -->
  <g id="system-payment">
    <rect x="1360" y="605" width="165" height="50" rx="6" fill="#0a0a0a" stroke="#ffffff" stroke-width="2" />
    <text x="1442" y="625" fill="#aaaaaa" font-size="10" font-family="monospace" text-anchor="middle">&lt;&lt;External System&gt;&gt;</text>
    <text x="1442" y="643" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">Payment Gateway</text>
  </g>

  <g id="system-rabbitmq">
    <rect x="1360" y="715" width="165" height="50" rx="6" fill="#0a0a0a" stroke="#ffffff" stroke-width="2" />
    <text x="1442" y="735" fill="#aaaaaa" font-size="10" font-family="monospace" text-anchor="middle">&lt;&lt;Event Broker&gt;&gt;</text>
    <text x="1442" y="753" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">RabbitMQ Broker</text>
  </g>

  <!-- FOOTER LEGEND -->
  <g id="legend">
    <rect x="290" y="1070" width="1000" height="35" rx="6" fill="#050505" stroke="#ffffff" stroke-width="1" />
    <text x="310" y="1092" fill="#ffffff" font-size="11" font-weight="bold" font-family="monospace">LEGEND:</text>
    <line x1="375" y1="1088" x2="415" y2="1088" stroke="#ffffff" stroke-width="2" />
    <text x="425" y="1092" fill="#aaaaaa" font-size="11">Association</text>
    <line x1="510" y1="1088" x2="550" y2="1088" stroke="#ffffff" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#white-arrow)" />
    <text x="560" y="1092" fill="#aaaaaa" font-size="11">&lt;&lt;include&gt;&gt; Dependency</text>
    <ellipse cx="725" cy="1088" rx="14" ry="9" fill="#000000" stroke="#ffffff" stroke-width="1.5" />
    <text x="748" y="1092" fill="#aaaaaa" font-size="11">Use Case</text>
    <rect x="830" y="1080" width="24" height="16" rx="3" fill="#000000" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="4 3" />
    <text x="862" y="1092" fill="#aaaaaa" font-size="11">System Boundary</text>
  </g>
</svg>

