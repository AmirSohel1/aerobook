# ==============================================================================
# Aerobook Cloud Airline Platform - Booking & Messaging Service (Port 8088)
# ==============================================================================

# Application Identifier used for Eureka registration and configuration binding
spring.application.name=booking-service

# Optional Spring Cloud Config Server Import
spring.config.import=optional:configserver:http://localhost:8080

# ------------------------------------------------------------------------------
# Embedded Tomcat Ingress Port
# ------------------------------------------------------------------------------
server.port=8088

# ------------------------------------------------------------------------------
# MySQL 8 Database Configuration
# ------------------------------------------------------------------------------
# Database JDBC URL: Connects to 'aerobook_booking_db' schema; creates it if missing
spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3306/aerobook_booking_db?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=root
spring.datasource.password=Amir1121@
spring.datasource.username=${MYSQL_USERNAME:root}
spring.datasource.password=${MYSQL_PASSWORD:Amir1121@}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ------------------------------------------------------------------------------
# JPA / Hibernate Configuration
# ------------------------------------------------------------------------------
# DDL schema mode: validates and updates existing booking and passenger tables
spring.jpa.hibernate.ddl-auto=update
# Disable Open EntityManager in View pattern to prevent web threads holding database connections
spring.jpa.open-in-view=false

# ------------------------------------------------------------------------------
# Netflix Eureka Service Discovery Client
# ------------------------------------------------------------------------------
# Register Booking Service with Eureka discovery registry
eureka.client.register-with-eureka=true
# Enable fetching service metadata for OpenFeign clients (Flight & Fare services)
eureka.client.fetch-registry=true
# Eureka discovery server registration endpoint
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
# Prefer container / host IP address over hostname in discovery registry
eureka.instance.prefer-ip-address=true

# ------------------------------------------------------------------------------
# RabbitMQ Message Broker Configuration
# ------------------------------------------------------------------------------
# AMQP connection coordinates for asynchronous event publishing (BOOKING_CREATED)
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
# Feature toggle allowing graceful degradation when RabbitMQ broker is offline in dev
app.rabbitmq.enabled=${RABBITMQ_ENABLED:false}
spring.rabbitmq.listener.simple.auto-startup=${RABBITMQ_ENABLED:false}

# ==========================================
# SWAGGER / OPENAPI CONFIGURATION
# ==========================================
# ------------------------------------------------------------------------------
# Jackson JSON Serialization
# ------------------------------------------------------------------------------
# Exclude null values from JSON responses to prevent OpenAPI $ref resolver issues
spring.jackson.default-property-inclusion=non_null

# ------------------------------------------------------------------------------
# SpringDoc OpenAPI 3 / Swagger UI Configuration
# ------------------------------------------------------------------------------
# Enable OpenAPI JSON endpoint generation at /v3/api-docs
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/v3/api-docs

# Enable interactive Swagger UI HTML interface at /swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html

# Collapse operations list by default for clean presentation
springdoc.swagger-ui.doc-expansion=list
# Sort operations by HTTP method (GET, POST, PUT, DELETE)
springdoc.swagger-ui.operations-sorter=method
# Sort API group tags alphabetically
springdoc.swagger-ui.tags-sorter=alpha
# Enable dynamic endpoint filtering
springdoc.swagger-ui.filter=true
# Retain JWT authorization token on page refreshes
springdoc.swagger-ui.persist-authorization=true
# Display response execution duration in milliseconds
springdoc.swagger-ui.display-request-duration=true
# Pre-expand 'Try it out' controls for instant testing
springdoc.swagger-ui.try-it-out-enabled=true

