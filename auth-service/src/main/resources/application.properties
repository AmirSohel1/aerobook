# ==========================================
# APPLICATION CORE SETTINGS
# ==========================================
# Unique microservice application name used for service registration and distributed tracing
spring.application.name=auth-service

# Optional Spring Cloud Config Server endpoint; fails silently if config server is unavailable
spring.config.import=optional:configserver:http://localhost:8080

# Dedicated HTTP port for the auth-service container
server.port=8082


# ==========================================
# DATABASE (MYSQL) CONFIGURATION
# ==========================================
# JDBC connection string connecting to local MySQL instance with automatic database creation
spring.datasource.url=jdbc:mysql://localhost:3306/aerobook_auth_db?createDatabaseIfNotExist=true

# Database user credentials with environment variable fallbacks
spring.datasource.username=${MYSQL_USERNAME:root}
spring.datasource.password=${MYSQL_PASSWORD:Amir1121@}

# MySQL JDBC Driver class
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# ==========================================
# JPA / HIBERNATE ORM
# ==========================================
# Schema auto-generation mode ('update' validates and alters existing tables without dropping data)
spring.jpa.hibernate.ddl-auto=update

# Enable SQL statement logging in application logs for debugging queries
spring.jpa.show-sql=true

# Pretty-print logged SQL queries
spring.jpa.properties.hibernate.format_sql=true

# Explicit MySQL dialect (optional in Hibernate 6+)
#spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect


# ==========================================
# NETFLIX EUREKA SERVICE DISCOVERY
# ==========================================
# Register auth-service with Eureka service registry
eureka.client.register-with-eureka=true

# Enable fetching service registry instance definitions for inter-service communication (OpenFeign)
eureka.client.fetch-registry=true

# Service URL of the Eureka Discovery Server
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Prefer container IP address over hostname when registering with Eureka
eureka.instance.prefer-ip-address=true


# ==========================================
# JWT & SECURITY CONFIGURATION
# ==========================================
# Cryptographic secret key used to sign HMAC-SHA256 tokens (minimum 256 bits / 32 characters)
jwt.secret=MySuperSecretKeyForJwtGenerationMustBeAtLeast32Characters

# JWT Access Token expiration duration in milliseconds (3600000 ms = 1 hour)
jwt.expiration=3600000

# JWT Refresh Token expiration duration in milliseconds (604800000 ms = 7 days)
jwt.refresh-expiration=604800000

# Whitelist of email addresses automatically granted ROLE_ADMIN during registration
auth.admin.emails=admin@aerobook.com,admin1@aerobook.com

# Master setup secret key required for registering administrative accounts
auth.admin.registration.key=${ADMIN_REGISTRATION_KEY:AerobookAdminSetup2026}


# ==========================================
# LOGGING CONFIGURATION
# ==========================================
logging.level.root=INFO
logging.level.org.springframework.security=INFO
logging.level.com.aerobook=DEBUG
logging.pattern.console=%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(%5p) %clr(${PID:- }){magenta} --- [%15.15t] %clr(%-40.40logger{39}){cyan} : %m%n


# ==========================================
# JSON SERIALIZATION (JACKSON)
# ==========================================
# Date format customization (disabled by default)
#spring.jackson.serialization.WRITE_DATES_AS_TIMESTAMPS=false
#spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
#spring.jackson.time-zone=Asia/Kolkata


# ==========================================
# SPRING BOOT ACTUATOR MONITORING
# ==========================================
# Expose all management web endpoints (health, info, metrics, env)
management.endpoints.web.exposure.include=*

# Display full health component details (database, disk space) in /actuator/health
management.endpoint.health.show-details=always


# ==========================================
# JACKSON CONFIGURATION
# ==========================================
# Exclude null fields from JSON serialization to prevent OpenAPI resolver errors
spring.jackson.default-property-inclusion=non_null

# ==========================================
# SPRINGDOC OPENAPI 3 / SWAGGER UI
# ==========================================
# Enable OpenAPI JSON documentation generation
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/v3/api-docs

# Enable interactive Swagger UI HTML interface
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html

# Display endpoint operations in collapsed list format by default
springdoc.swagger-ui.doc-expansion=list

# Sort operations by HTTP method (GET, POST, PUT, DELETE)
springdoc.swagger-ui.operations-sorter=method

# Sort API tags alphabetically
springdoc.swagger-ui.tags-sorter=alpha

# Enable dynamic keyword filtering of operations in the UI
springdoc.swagger-ui.filter=true

# Persist authorization token across browser refreshes
springdoc.swagger-ui.persist-authorization=true

# Display elapsed HTTP response duration for executed requests
springdoc.swagger-ui.display-request-duration=true

# Enable 'Try it out' controls by default
springdoc.swagger-ui.try-it-out-enabled=true