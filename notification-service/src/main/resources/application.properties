# ==============================================================================
# Aerobook Cloud Airline Platform - Notification & Alert Service (Port 8091)
# ==============================================================================

# Application Identifier used for Eureka registration and configuration binding
spring.application.name=notification-service

# Optional Spring Cloud Config Server Import
spring.config.import=optional:configserver:http://localhost:8080

# ------------------------------------------------------------------------------
# Embedded Tomcat Ingress Port
# ------------------------------------------------------------------------------
server.port=8091

# ------------------------------------------------------------------------------
# MySQL 8 Database Configuration
# ------------------------------------------------------------------------------
# Database JDBC URL: Connects to 'aerobook_notification_db' schema; creates it if missing
spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3306/aerobook_notification_db?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${MYSQL_USERNAME:root}
spring.datasource.password=${MYSQL_PASSWORD:Amir1121@}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ------------------------------------------------------------------------------
# JPA / Hibernate Configuration
# ------------------------------------------------------------------------------
# DDL schema mode: validates and updates existing notification tables
spring.jpa.hibernate.ddl-auto=update
# Disable Open EntityManager in View to prevent web thread database connection holding
spring.jpa.open-in-view=false

# ------------------------------------------------------------------------------
# Netflix Eureka Service Discovery Client
# ------------------------------------------------------------------------------
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

# ==========================================
# SWAGGER / OPENAPI CONFIGURATION
# ==========================================
spring.jackson.default-property-inclusion=non_null

springdoc.api-docs.enabled=true
springdoc.api-docs.path=/v3/api-docs

springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.doc-expansion=list
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.filter=true
springdoc.swagger-ui.persist-authorization=true
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.try-it-out-enabled=true

