# ==============================================================================
# Aerobook Cloud Airline Platform - User Profile Management Service (Port 8084)
# ==============================================================================

# Application Identifier used for service registration and configuration lookup
spring.application.name=user-service

# Optional Spring Cloud Config Server Import
spring.config.import=optional:configserver:http://localhost:8080

# ------------------------------------------------------------------------------
# MySQL 8 Database Configuration
# ------------------------------------------------------------------------------
# Database JDBC URL: Connects to 'aerobook_user_db' schema; creates it if missing
spring.datasource.url=jdbc:mysql://localhost:3306/aerobook_user_db?createDatabaseIfNotExist=true
spring.datasource.username=${MYSQL_USERNAME:root}
spring.datasource.password=${MYSQL_PASSWORD:Amir1121@}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ------------------------------------------------------------------------------
# JPA / Hibernate Configuration
# ------------------------------------------------------------------------------
# DDL schema mode: validates and alters tables without dropping existing customer data
spring.jpa.hibernate.ddl-auto=update
# Disable Open EntityManager in View pattern to avoid database connections lingering in web requests
spring.jpa.open-in-view=false
# Enable SQL logging for development diagnostics
spring.jpa.show-sql=true
# Pretty-print formatted SQL queries in console
# ------------------------------------------------------------------------------
# Logging Configuration (SLF4J / Logback)
# ------------------------------------------------------------------------------
logging.level.root=INFO
logging.level.com.aerobook=DEBUG
logging.level.org.springframework.web=INFO
logging.pattern.console=%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(%5p) %clr(${PID:- }){magenta} --- [%15.15t] %clr(%-40.40logger{39}){cyan} : %m%n

# ------------------------------------------------------------------------------
# Embedded Tomcat Server Configuration
# ------------------------------------------------------------------------------
# Dedicated HTTP server port for User Profile Service
server.port=8084

# ------------------------------------------------------------------------------
# Netflix Eureka Service Discovery Client
# ------------------------------------------------------------------------------
# Register User Service with Eureka service discovery
eureka.client.register-with-eureka=true
# Fetch registry metadata for inter-service communication
eureka.client.fetch-registry=true
# Eureka discovery server registration endpoint
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
# Prefer container / host IP address over hostname in discovery registry
eureka.instance.prefer-ip-address=true

# ------------------------------------------------------------------------------
# Jackson JSON Serialization
# ------------------------------------------------------------------------------
# Exclude null values from JSON responses to prevent OpenAPI $ref resolver issues
spring.jackson.default-property-inclusion=non_null

# ------------------------------------------------------------------------------
# SpringDoc OpenAPI 3 / Swagger UI Configuration
# ------------------------------------------------------------------------------
# Enable OpenAPI JSON endpoint generation at /v3/api-docs
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/v3/api-docs

# Enable interactive Swagger UI HTML interface at /swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html

# Collapse operations list by default for clean presentation
springdoc.swagger-ui.doc-expansion=list
# Sort operations by HTTP method (GET, POST, PUT, DELETE)
springdoc.swagger-ui.operations-sorter=method
# Sort API group tags alphabetically
springdoc.swagger-ui.tags-sorter=alpha
# Enable dynamic endpoint filtering
springdoc.swagger-ui.filter=true
# Retain JWT authorization token on page refreshes
springdoc.swagger-ui.persist-authorization=true
# Display response execution duration in milliseconds
springdoc.swagger-ui.display-request-duration=true
# Pre-expand 'Try it out' controls for instant testing
springdoc.swagger-ui.try-it-out-enabled=true